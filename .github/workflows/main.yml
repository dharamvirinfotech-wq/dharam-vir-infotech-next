name: Deploy Next.js App to cPanel

on:
  workflow_dispatch:

  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Build Next.js
        run: npm run build

      - name: Verify Standalone Build
        run: |
          echo "Checking Next.js build..."

          if [ ! -d ".next" ]; then
            echo "ERROR: .next directory does not exist."
            exit 1
          fi

          if [ ! -f ".next/BUILD_ID" ]; then
            echo "ERROR: .next/BUILD_ID does not exist."
            exit 1
          fi

          if [ ! -d ".next/standalone" ]; then
            echo "ERROR: .next/standalone directory does not exist."
            echo "Check next.config.js and make sure:"
            echo "output: 'standalone'"
            exit 1
          fi

          echo "================================"
          echo "Next.js build successful"
          echo "================================"

          echo "BUILD_ID:"
          cat .next/BUILD_ID

          echo ""
          echo "Standalone files:"
          ls -la .next/standalone

      - name: Prepare Standalone Deployment
        run: |
          rm -rf deploy
          mkdir -p deploy

          echo "Copying standalone application..."

          cp -r .next/standalone/. deploy/

          echo "Copying static files..."

          mkdir -p deploy/.next/static
          cp -r .next/static/. deploy/.next/static/

          echo "Copying public directory..."

          if [ -d "public" ]; then
            cp -r public deploy/public
          fi

          echo ""
          echo "================================"
          echo "Deployment prepared"
          echo "================================"

          echo "Deployment size:"
          du -sh deploy

          echo ""
          echo "Deployment files:"
          find deploy -type f | wc -l

          echo ""
          echo "Deployment structure:"
          find deploy -maxdepth 2 -type d | sort

      - name: Deploy to cPanel
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}

          protocol: ftp
          port: 21

          local-dir: ./deploy/

          server-dir: /dharamvirinfotech.com/

          timeout: 120000

          exclude: |
            **/.git*
            **/.git*/**
