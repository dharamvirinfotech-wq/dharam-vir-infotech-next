name: Deploy Next.js App to cPanel

on:
  workflow_dispatch:

  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:

      # ==========================================
      # Checkout
      # ==========================================
      - name: Checkout Repository
        uses: actions/checkout@v4


      # ==========================================
      # Node.js
      # ==========================================
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm


      # ==========================================
      # Install
      # ==========================================
      - name: Install Dependencies
        run: npm ci


      # ==========================================
      # Verify Config
      # ==========================================
      - name: Verify Next.js Config
        run: |
          echo "================================"
          echo "Next.js configuration files"
          echo "================================"

          find . -maxdepth 1 -name "next.config.*" -print

          echo ""
          echo "================================"
          echo "next.config.cjs"
          echo "================================"

          if [ ! -f "next.config.cjs" ]; then
            echo "ERROR: next.config.cjs not found!"
            exit 1
          fi

          cat next.config.cjs


      # ==========================================
      # Build
      # ==========================================
      - name: Build Next.js
        run: |
          rm -rf .next
          npm run build


      # ==========================================
      # Verify Build
      # ==========================================
      - name: Verify Standalone Build
        run: |
          echo "================================"
          echo "Checking Next.js build"
          echo "================================"

          if [ ! -d ".next" ]; then
            echo "ERROR: .next directory does not exist."
            exit 1
          fi

          if [ ! -f ".next/BUILD_ID" ]; then
            echo "ERROR: .next/BUILD_ID does not exist."
            exit 1
          fi

          echo "BUILD_ID:"
          cat .next/BUILD_ID

          echo ""
          echo "Checking standalone directory..."

          if [ ! -d ".next/standalone" ]; then
            echo "ERROR: .next/standalone directory does not exist."

            echo ""
            echo "Contents of .next:"
            find .next -maxdepth 3 -type d | sort

            exit 1
          fi

          echo ""
          echo "SUCCESS: Standalone build exists."

          ls -la .next/standalone


      # ==========================================
      # Prepare Deployment
      # ==========================================
      - name: Prepare Standalone Deployment
        run: |
          rm -rf deploy
          mkdir -p deploy

          echo "Copying standalone application..."

          cp -r .next/standalone/. deploy/

          echo "Copying static files..."

          mkdir -p deploy/.next/static
          cp -r .next/static/. deploy/.next/static/

          echo "Copying public files..."

          if [ -d "public" ]; then
            cp -r public deploy/public
          fi

          echo ""
          echo "================================"
          echo "Deployment Information"
          echo "================================"

          echo "Deployment size:"
          du -sh deploy

          echo ""
          echo "File count:"
          find deploy -type f | wc -l

          echo ""
          echo "Deployment directories:"
          find deploy -maxdepth 2 -type d | sort


      # ==========================================
      # FTP Deployment
      # ==========================================
      - name: Deploy to cPanel
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}

          protocol: ftp
          port: 21

          local-dir: ./deploy/

          server-dir: /dharamvirinfotech.com/

          timeout: 120000

          exclude: |
            **/.git*
            **/.git*/**
